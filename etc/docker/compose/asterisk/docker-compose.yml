services:
  asterisk:
    container_name: ASTERISK
    image: andrius/asterisk:22
    hostname: asterisk
    network_mode: host
    volumes:
      - /etc/certs/base/full.pem:/cert.pem:ro
      - /etc/certs/base/cert.key:/cert.key:ro

      - ./data/etc/asterisk:/etc/asterisk:ro
      - ./data/var/lib/asterisk/moh:/var/lib/asterisk/moh:ro
      - ./data/var/lib/asterisk/agi-bin:/var/lib/asterisk/agi-bin:ro
      - ./data/var/lib/asterisk/scripts:/var/lib/asterisk/scripts:ro

      - ./data/var/lib/asterisk/astdb.sqlite3:/var/lib/asterisk/astdb.sqlite3
    environment:
      - TZ=Europe/Bratislava
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: "10m"
