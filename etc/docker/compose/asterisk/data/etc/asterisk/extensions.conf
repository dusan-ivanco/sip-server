[general]
static          = yes
writeprotect    = yes
autofallthrough = yes

[default]
exten => _XXX,1,NoOp()
 same => n,Answer()
 same => n,System(/var/lib/asterisk/scripts/doorbell ${CALLERID(num)} ${EXTEN} &)
 same => n,ConfBridge(doorbell_room,doorbell_bridge,doorbell_device)
 same => n,Hangup()

[doorbell]
exten => s,1,NoOp()
 same => n,ConfBridge(doorbell_room,doorbell_bridge,doorbell_agents)
 same => n,Hangup()
