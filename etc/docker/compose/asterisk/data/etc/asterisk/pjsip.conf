[nat](!)
local_net                  = 10.0.0.0/8
local_net                  = 127.0.0.0/8
external_media_address     = 1.2.3.4
external_signaling_address = 1.2.3.4

[wss-ipv4]
type                       = transport
protocol                   = wss
bind                       = 0.0.0.0

[wss-ipv6]
type                       = transport
protocol                   = wss
bind                       = [::]

[udp-ipv4]
type                       = transport
protocol                   = udp
bind                       = 0.0.0.0:5060

[udp-ipv6]
type                       = transport
protocol                   = udp
bind                       = [::]:5060

[tcp-ipv4]
type                       = transport
protocol                   = tcp
bind                       = 0.0.0.0:5060

[tcp-ipv6]
type                       = transport
protocol                   = tcp
bind                       = [::]:5060

[tls-ipv4]
type                       = transport
protocol                   = tls
bind                       = 0.0.0.0:5061

method                     = tlsv1_2
cert_file                  = /cert.pem
priv_key_file              = /cert.key

verify_client              = no
verify_server              = no

[tls-ipv6]
type                       = transport
protocol                   = tls
bind                       = [::]:5061

method                     = tlsv1_2
cert_file                  = /cert.pem
priv_key_file              = /cert.key

verify_client              = no
verify_server              = no

[aor](!)
type                       = aor
max_contacts               = 25
remove_existing            = yes

[auth](!)
type                       = auth
auth_type                  = userpass

[endpoint](!)
type                       = endpoint
context                    = default
disallow                   = all
allow                      = alaw,h264
from_domain                = sip.domain.tld

rewrite_contact            = yes
rtp_symmetric              = yes
direct_media               = no
force_rport                = yes
ice_support                = yes

[001](aor)
[999](aor)

[001](auth)
username                   = 001
password                   = secret

[999](auth)
username                   = 999
password                   = secret

[001](endpoint)
transport                  = wss-ipv4
aors                       = 001
auth                       = 001
webrtc                     = yes

[999](endpoint)
transport                  = tls-ipv4
aors                       = 999
auth                       = 999
